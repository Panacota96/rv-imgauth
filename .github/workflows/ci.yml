name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain pinned in rust-toolchain.toml
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Dependency licences and sources (cargo-deny; no GPL/AGPL/LGPL)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: clippy (findings also surfaced as annotations)
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.log; then
            grep -E "^(src|fuzz|tests)/.*(error|warning)" clippy.log | head -40 | while IFS= read -r l; do echo "::error title=clippy::${l}"; done
            exit 1
          fi
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  msrv:
    # The minimum Rust versions declared in Cargo.toml (rust-version) really build: 1.88 for the CLI and the
    # core crates (edition 2024 let chains), 1.95 for the GUI (egui 0.37). `cargo +X` overrides rust-toolchain.toml.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the declared minimum toolchains
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup toolchain install 1.95.0 --profile minimal
      - name: cargo check with the declared minimums
        run: |
          cargo +1.88.0 check --locked -p rv-imgauth-cli -p rv-imgauth-core -p rv-imgauth-img
          cargo +1.95.0 check --locked -p rv-imgauth-gui

  test:
    needs: lint
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain pinned in rust-toolchain.toml
        id: toolchain
        shell: bash
        run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python helpers (independent verifiers + local test TSA/PKI for the trust tests + image oracles)
        run: pip install blake3 jsonschema pyhanko pillow==12.3.0 numpy==2.5.3 PyWavelets==1.10.0
      - name: Unit and integration tests (includes docs/usage-cli.md drift check and trust tests)
        shell: bash
        env:
          RV_TEST_PYTHON: python
        run: |
          set -o pipefail
          # Failures are also surfaced as annotations (readable through the API without downloading logs).
          # A hard limit: a hung test must fail the job (and say which test) instead of holding the runner for hours.
          if ! timeout 40m cargo test --workspace --locked 2>&1 | tee test.log; then
            grep -E "panicked at|^---- |FAILED|^failures:|assertion|Error:|error:|running for over|^     Running" test.log | tail -40 | while IFS= read -r l; do echo "::error title=cargo test::${l}"; done
            exit 1
          fi
      - name: Self-test of the hash implementations
        run: cargo run --locked -q -p rv-imgauth-cli -- self-test
      - name: Sample run
        shell: bash
        run: |
          # The whole sample folder against the two reference images, with every map. pix-copy-move.jpg has a
          # high-severity finding (COPY_MOVE_CANDIDATE): exit code 3 is expected; crash.jpg must not stop the run.
          ev=examples/sample/evidence
          rc=0
          cargo run --locked -q -p rv-imgauth-cli -- analyze -i $ev -r --maps ela,noise,ghosts --reference $ev/reference/ref-1.jpg --reference $ev/reference/ref-2.jpg --hash sha256,blake3 --lang all --out ci-out --progress none --no-timestamp || rc=$?
          test "$rc" -eq 3
      - name: Cross-language verification (Python re-checks the chain, hashes and JSON schemas)
        shell: bash
        run: |
          run=$(find ci-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          python tests/verify_chain.py "ci-out/logs/$run"
          python tests/validate_reports.py "ci-out/reports/$run"
      - name: Sample findings, evidence digests, verify-log and reproducibility (tests/run_samples.py)
        shell: bash
        run: |
          bin=target/debug/rv-imgauth
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          python tests/run_samples.py "$bin" sample-check
      - name: Image oracles (Pillow quantization tables, ExifTool metadata, numpy/PyWavelets noise maps)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libimage-exiftool-perl
          run=$(find ci-out/reports -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          python tests/oracle_qt.py "ci-out/reports/$run"
          python tests/oracle_exiftool.py "ci-out/reports/$run"
          python tests/oracle_maps.py --reports "ci-out/reports/$run"
      - name: Real TSA smoke test (DigiCert; network-dependent, informative)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          cargo run --locked -q -p rv-imgauth-cli -- analyze -i examples/sample/evidence --maps none --copy-move off --out tsa-out --progress none > tsa.txt || test $? -eq 3
          cat tsa.txt
          grep -q "timestamp: ok" tsa.txt
          run=$(find tsa-out/logs -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 1)
          cargo run --locked -q -p rv-imgauth-cli -- verify-log "tsa-out/logs/$run"
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked -p rv-imgauth-cli -p rv-imgauth-gui
      - name: Installer compiles (Inno Setup; installed with Chocolatey when the image lacks it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { exit 1 } }
          & $iscc /DAppVersion=0.0.0 /DSourceDir=$PWD /O$PWD\dist packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Installer round trip (user PATH entry added on install, removed on uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-setup.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Rakvor\RV ImgAuth"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=addtopath' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not ($path.Split(";") -contains $dir)) { throw "PATH entry missing after install: $path" }
          & (Join-Path $dir "rv-imgauth.exe") self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exit code $($u.ExitCode)" }
          # The uninstaller re-launches itself from %TEMP%: poll until it has finished.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "rv-imgauth.exe")); $i++) { Start-Sleep -Seconds 1 }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if ($path -and ($path.Split(";") -contains $dir)) { throw "PATH entry left after uninstall: $path" }
          "PATH entry added on install and removed on uninstall"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rv-imgauth-windows-x64-${{ github.sha }}
          path: |
            target/release/rv-imgauth.exe
            target/release/rv-imgauth-gui.exe
          retention-days: 14
