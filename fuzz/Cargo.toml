# cargo-fuzz target for the image layer (nightly only, not part of the workspace; CI: .github/workflows/fuzz.yml):
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run parse -- -max_total_time=600
# Seed the corpus with the samples: mkdir -p fuzz/corpus/parse && cp examples/sample/evidence/* fuzz/corpus/parse/
[package]
name = "rv-imgauth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rv-imgauth-img = { path = "../src/img" }

# Keep this crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
