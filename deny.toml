# cargo-deny: licence allow-list and source policy (no GPL/AGPL/LGPL components: the tool is proprietary and
# source-auditable). Run `cargo deny check licenses bans sources`; CI runs it on every push.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    # jpeg-encoder (re-encoding for ELA and JPEG ghosts): permissive; requires the IJG acknowledgement in NOTICE.
    "IJG",
]
# The workspace's own crates carry the proprietary licence (LICENSE).
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
