[workspace]
resolver = "3"
members = ["src/img", "src/core", "src/cli", "src/gui"]

[workspace.package]
# Crate version only — never bumped. The product version is version.txt (release-please), so Cargo.lock
# does not change on release and `--locked` builds keep working.
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Rakvor-Audit"
publish = false
# Minimum supported Rust for the CLI, core and image crates: 1.88 (edition 2024 `let` chains, stable
# since 1.88; every non-GUI dependency in Cargo.lock declares <= 1.85). The GUI crate overrides it to 1.95
# (egui/eframe 0.37). CI checks both minimums (job `msrv`); releases use rust-toolchain.toml (1.97.0).
rust-version = "1.88"
authors = ["Rakvor"]
repository = "https://github.com/Panacota96/rv-imgauth"

[workspace.dependencies]
rv-imgauth-core = { path = "src/core" }
rv-imgauth-img = { path = "src/img" }
# Image layer (src/img): parsers, metadata, pixel decoding and analyses. Pure Rust, no GPL/AGPL.
kamadak-exif = "0.6"
quick-xml = "0.42"
zune-jpeg = "0.4"
image-webp = "0.2"
jpeg-encoder = "0.7"
rustfft = "6.4"
rayon = "1.12"
# Image viewer (GUI): decodes the PNG maps written in each item folder.
png = "0.18"
# Worker isolation: RLIMIT_AS (Unix) and Job Objects (Windows).
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
blake3 = "1.8"
digest = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minijinja = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2.5"
clap = { version = "4.6", features = ["derive", "wrap_help", "env"] }
indicatif = "0.18"
ctrlc = "3.5"
# No-echo terminal prompt for the certificate password (Apache-2.0).
rpassword = "7.5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
rfd = "0.17"
# Trust: RFC 3161 timestamps + PDF signatures (RustCrypto, pure Rust; versions aligned on der 0.7)
ureq = "3"
p12-keystore = "0.4"
cms = { version = "0.2", features = ["builder"] }
x509-tsp = "0.1"
x509-cert = { version = "0.2", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
spki = "0.7"
const-oid = { version = "0.9", features = ["db"] }
rsa = { version = "0.9", features = ["sha2"] }
sha2-legacy = { package = "sha2", version = "0.10" }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols are kept (no strip, no UPX): packed or stripped binaries raise antivirus false positives.
